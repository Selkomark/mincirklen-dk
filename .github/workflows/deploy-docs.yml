name: Deploy design-system catalog

on:
  push:
    branches: [main]
    paths:
      - 'services/web-app/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        working-directory: services/web-app
        run: bun install --frozen-lockfile
      - name: Build catalog site
        # Builds src/main.tsx's mode==="catalog" branch — the design-system
        # catalog only, not the real product (that runs against a live
        # backend now — dev-mincirklen.dk locally, GKE/Cloud Run in prod,
        # see IaC/ — and was never meant to be a GitHub Pages static
        # export). See main.tsx.
        working-directory: services/web-app
        run: bun run build:docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: services/web-app/dist-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
